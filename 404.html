<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Page not found — SAM TRAVEL</title>
<!-- Страницу отдают по любому несуществующему адресу, на любой глубине — пути от корня. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --ground:#000; --ink:#fff; --ink-dim:rgba(255,255,255,.5);
    --brand:#5ba3f2; --line:rgba(255,255,255,.12);
    --font-ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--font-ui)}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 20px}
  main{width:100%;max-width:440px;text-align:center}
  .brand{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;margin-bottom:44px}
  .brand img{height:24px}.brand span{font-weight:700;letter-spacing:.14em;font-size:13px}
  .code{font-size:clamp(72px,24vw,120px);font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--brand);margin:0 0 14px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:var(--ink-dim);font-size:15px;line-height:1.5;margin:0 0 28px}
  .home{display:inline-block;padding:12px 22px;border-radius:11px;background:var(--brand);color:#04121f;
    font-weight:700;font-size:15px;text-decoration:none}
  .home:hover{filter:brightness(1.08)}
  .home:focus-visible,.brand:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
</style>
</head>
<body>
  <main>
    <a class="brand" href="/"><img src="/sam-logo.png" alt=""><span>SAM TRAVEL</span></a>
    <div class="code" aria-hidden="true">404</div>
    <h1 data-t="title">Page not found</h1>
    <p data-t="text">This address doesn’t exist or the page has moved. All our tours are on the home page.</p>
    <a class="home" href="/" data-t="home">Back to home</a>
  </main>
  <script src="/js/notfound.js"></script>
</body>
</html>
